name: CH32 USBHS regressions

on:
  push:
    branches: [ch32-adapt]
  pull_request:
    branches: [ch32-adapt]

permissions:
  contents: read

jobs:
  state-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native driver regressions with sanitizers
        run: ./tests/ch32_usbhs/run.sh
